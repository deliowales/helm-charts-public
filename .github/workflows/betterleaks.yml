name: Betterleaks

on:
  pull_request:

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    name: Betterleaks
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # betterleaks v2.0.0-rc.9; v2 has no stable image yet.
      # Scans the full git history, not just what the PR changed, so a secret
      # already on the default branch fails every PR until it is removed.
      - name: Scan the codebase
        id: scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/betterleaks/betterleaks@sha256:4258956e745465a9a0a8b71157d30ae9492d58a683934a69e432616f7f166daf git . --redact --output betterleaks-report.json

      - name: Build findings report
        if: always() && hashFiles('betterleaks-report.json') != ''
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = "success" ]; then
            echo "## 🔑 Betterleaks — all clear ✅" > report.md
          else
            {
              echo "## 🔑 Betterleaks — secrets found ❌"
              echo ""
              echo "| Rule | File | Line |"
              echo "|---|---|---|"
              jq -r '.findings[] | "| \(.rule_id) | \(.location.path) | \(.location.start_line) |"' betterleaks-report.json
              echo ""
              echo "Remove the secret from the codebase and rotate it. Deleting it does not remove it from git history."
            } > report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('report.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: betterleaks
          path: report.md
          only_update: ${{ steps.scan.outcome == 'success' }}
