{{- if eq .Values.deployment.enabled true}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node.application.name" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
  annotations:
    {{- include "node.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include "node.application.name" . }}"
  template:
    metadata:
      annotations:
        {{- include "node.annotations" . | nindent 8 }}
        {{- include "node.application.vault.annotations" . | nindent 8 }}
        {{- include "node.istio.proxy.annotations" . | nindent 8 }}
      labels:
        {{- include "node.labels" . | nindent 8 }}
        {{- if and (eq (include "node.cloud.provider" .) "Azure") (eq .Values.azure.identity.enabled true) }}
        aadpodidbinding: {{ .Values.azure.identity.name }}
        {{- end }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "node.deployment.topologySpreadConstraints" . | nindent 6 }}
      {{- if or .Values.deployment.nodeSelector.toleration .Values.deployment.nodeSelector.labels }}
      nodeSelector:
        {{- if .Values.deployment.nodeSelector.toleration }}
        {{- include "node.deployment.nodeSelector.toleration" . | nindent 8 }}
        {{- end }}
        {{- with .Values.deployment.nodeSelector.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.deployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "node.application.name" .) }}
      containers:
        - name: "{{ include "node.application.name" . }}"
          image: "{{ include "node.application.imageURL" . }}"
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          securityContext: {{ include "node.application.securityContext" . | nindent 12 }}
          env:
            {{- $defaults := list
                (dict "name" "APP_NAME" "value" (.Values.application.name | lower))
                (dict "name" "DISABLE_INSTANA" "value" "true")
                (dict "name" "PLATFORM" "value" (include "node.cloud.provider" .))
                (dict "name" "SENTRY_ENABLED" "value" "true")
                (dict "name" "SENTRY_ENVIRONMENT" "value" .Values.cloud.environment)
                (dict "name" "SENTRY_PROFILING_TRACE_SAMPLE_RATE" "value" (ternary "0.5" "1" (any (eq .Values.cloud.environment "demo") (eq .Values.cloud.environment "production"))))
                (dict "name" "SENTRY_PROFILING_PROFILES_SAMPLE_RATE" "value" "1") }}
            {{- if eq (include "node.cloud.provider" .) "AWS" }}
            {{- $defaults = append $defaults (dict "name" "AWS_REGION" "value" .Values.cloud.region) }}
            {{- end }}
            {{- $defaults = append $defaults (dict "name" "NODE_OPTIONS" "value" (printf "--max-http-header-size=%v%s" (.Values.application.nodeOptions.maxHttpHeaderSize | default 65536) (ternary (printf " --max-old-space-size=%v" .Values.application.nodeOptions.maxOldSpaceSize) "" (not (empty .Values.application.nodeOptions.maxOldSpaceSize))))) }}
            {{- include "node.application.env" (dict "defaults" $defaults "env" .Values.application.env) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.application.ports.containerPort }}
              protocol: TCP
          resources:
            {{- include "node.resources" .Values.application.resources | nindent 12 }}
          livenessProbe:
            {{- if eq .Values.application.livenessProbe.type "tcp" }}
            tcpSocket:
              port: {{ .Values.application.livenessProbe.port  }}
            {{- else }}
            httpGet:
              port: 3000
              path: {{ .Values.application.readinessProbe.path }}
            {{- end }}
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            {{- if eq .Values.application.readinessProbe.type "tcp" }}
            tcpSocket:
              port: {{ .Values.application.readinessProbe.port  }}
            {{- else }}
            httpGet:
              port: 3000
              path: {{ .Values.application.readinessProbe.path }}
            {{- end }}
            initialDelaySeconds: 5
            timeoutSeconds: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.application.extraVolumes -}}
            {{- include "node.application.extraConfigmapMounts" . | nindent 12 }}
            {{- end }}
      securityContext:
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.application.extraVolumes -}}
        {{- include "node.application.extraConfigmapVolumes" . | nindent 8 }}
        {{- end }}
{{- end }}
