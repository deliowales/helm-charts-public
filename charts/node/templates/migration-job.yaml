{{ if eq .Values.application.migrations.enabled true }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.application.name }}-migrations"
  labels:
    {{- include "node.labels" . | nindent 4 }}
  annotations:
    {{- include "node.annotations" . | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      annotations:
        {{- include "node.annotations" . | nindent 8 }}
        {{- include "node.application.vault.annotations" . | nindent 8 }}
        {{- include "node.istio.proxy.annotations" . | nindent 8 }}
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
      {{/* Spelled out, not `node.labels` + instance: those are the application's
      own identity, and the PDB selects on them. A Job has no scale subresource,
      so matching one wedges the disruption controller. */}}
      labels:
        app.kubernetes.io/name: {{ include "node.application.name" . }}-migrations
        chart: {{ include "node.chartref" . }}
        release: {{ .Release.Name }}
        {{- if and (eq (include "node.cloud.provider" .) "Azure") (eq .Values.azure.identity.enabled true) }}
        aadpodidbinding: {{ .Values.azure.identity.name }}
        {{- end }}
    spec:
      {{- with .Values.application.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "node.application.name" .) }}
      containers:
        - name: "{{ include "node.application.name" . }}"
          image: "{{ include "node.application.imageURL" . }}"
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          args: ["{{.Values.application.migrations.args }}"]
          env:
            {{- $defaults := list
                (dict "name" "APP_NAME" "value" (.Values.application.name | lower))
                (dict "name" "DISABLE_INSTANA" "value" "TRUE")
                (dict "name" "PLATFORM" "value" (include "node.cloud.provider" .)) }}
            {{- if eq (include "node.cloud.provider" .) "AWS" }}
            {{- $defaults = append $defaults (dict "name" "AWS_REGION" "value" .Values.cloud.region) }}
            {{- end }}
            {{- include "node.application.env" (dict "defaults" $defaults "env" .Values.application.env) | nindent 12 }}
          securityContext: {{ include "node.application.securityContext" . | nindent 12 }}
          resources:
            {{- include "node.resources" .Values.application.migrations.resources | nindent 12 }}
      {{- /* Never, not OnFailure: the entrypoint stops the Istio sidecar on the way
      out, and a sidecar that exits 0 is not restarted, so an in-place retry would
      run with no proxy. Never gives every attempt a fresh pod and sidecar. */}}
      restartPolicy: Never
  backoffLimit: {{ .Values.application.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.application.migrations.ttlSecondsAfterFinished }}
  {{- end }}
