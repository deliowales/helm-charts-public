{{- if eq .Values.supervisor.enabled true -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "php.application.name" . }}-supervisor
  labels:
    app.kubernetes.io/name: {{ include "php.application.name" . }}-supervisor
    chart: {{ include "php.chartref" . }}
    release: {{ .Release.Name }}
  annotations:
    {{- include "php.annotations" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "php.application.name" . }}-supervisor
  template:
    metadata:
      annotations:
        {{- include "php.annotations" . | nindent 8 }}
        {{- include "php.application.vault.annotations" . | nindent 8 }}
        {{- include "php.istio.proxy.annotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "php.application.name" . }}-supervisor
        chart: {{ include "php.chartref" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "php.application.name" . }}
      containers:
        - name: {{ include "php.application.name" . }}-supervisor
          image: "{{ include "php.application.imageURL" . }}"
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          args: ["supervisor"]
          securityContext: {{ include "php.application.securityContext" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - '-c'
                - pgrep -a supervisord
          env:
            {{- $defaults := list
                (dict "name" "PLATFORM" "value" (include "php.cloud.provider" .))
                (dict "name" "APP_NAME" "value" (.Values.application.name | lower))
                (dict "name" "LOG_CHANNEL" "value" "stderr") }}
            {{- if eq (include "php.cloud.provider" .) "AWS" }}
            {{- $defaults = append $defaults (dict "name" "AWS_REGION" "value" .Values.cloud.region) }}
            {{- end }}
            {{- include "php.application.env" (dict "defaults" $defaults "env" .Values.application.env) | nindent 12 }}
          resources:
            {{- include "php.resources" .Values.supervisor.resources | nindent 12 }}
          volumeMounts:
            - name: fpm-pool-config-volume
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
            - name: php-config-volume
              mountPath: /usr/local/etc/php/php.ini
              subPath: php.ini
            - name: shared-files
              mountPath: /var/www/html
            - name: supervisor-config-volume
              mountPath: /etc/supervisord.conf
              subPath: supervisord.conf
            - name: tmp
              mountPath: /tmp
        {{- if .Values.nightwatch.enabled }}
        - name: nightwatch-agent
          image: "{{ include "php.deployment.nightwatch.imageURL" . }}"
          imagePullPolicy: {{ .Values.nightwatch.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: true
          env:
            - name: PLATFORM
              value: "{{ include "php.cloud.provider" . }}"
            - name: APP_NAME
              value: {{ .Values.application.name | lower | quote }}
            {{- if eq (include "php.cloud.provider" .) "AWS" }}
            - name: AWS_REGION
              value: {{ .Values.cloud.region }}
            {{- end }}
            {{- range .Values.nightwatch.env }}
            - name: "{{ .name }}"
              value: "{{ .value }}"
            {{- end }}
          resources:
            {{- include "php.resources" .Values.nightwatch.resources | nindent 12 }}
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
              readOnly: true
        {{- end }}

      securityContext:
        fsGroup: 1000

      volumes:
        - name: fpm-pool-config-volume
          configMap:
            name: fpm-pool-configmap
        - name: php-config-volume
          configMap:
            name: php-configmap
        - name: supervisor-config-volume
          configMap:
            name: supervisor-configmap
        - name: shared-files
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end -}}
