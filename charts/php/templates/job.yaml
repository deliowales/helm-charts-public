{{ if eq .Values.job.enabled true }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.job.name }}
  annotations:
    {{- toYaml .Values.job.annotations | nindent 12 }}
spec:
  template:
    metadata:
      annotations:
        {{- include "php.istio.proxy.annotations" . | nindent 8 }}
        {{- if eq .Values.job.vault.enabled true }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.env }}
        vault.hashicorp.com/agent-inject-template-env: |
            {{- if .Values.vault.sharedEnv }}
            {{`{{ with secret "` }}{{ .Values.vault.sharedEnv }}{{`"  -}}
            {{ range $k, $v := .Data.data -}}
            export {{ $k }}='{{ $v }}'
            {{ end -}}
            {{ end -}}`}}
            {{- end }}
            {{`{{ with secret "` }}{{ .Values.vault.env }}{{`"  -}}
            {{ range $k, $v := .Data.data -}}
            export {{ $k }}='{{ $v }}'
            {{ end -}}
            {{ end -}}`}}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      {{- with .Values.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "php.application.name" . }}
      containers:
        - name: {{ include "php.application.name" . }}
          image: {{ include "php.application.imageURL" . }}
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          args: [{{ .Values.job.args }}]
          securityContext: {{ include "php.application.securityContext" . | nindent 12 }}
          env:
            {{- $defaults := list
                (dict "name" "PLATFORM" "value" (include "php.cloud.provider" .))
                (dict "name" "APP_NAME" "value" (.Values.application.name | lower))
                (dict "name" "SENTRY_ENABLED" "value" "true")
                (dict "name" "SENTRY_TRACES_SAMPLE_RATE" "value" (ternary "0.5" "1" (any (eq .Values.cloud.environment "demo") (eq .Values.cloud.environment "production"))))
                (dict "name" "SENTRY_PROFILES_SAMPLE_RATE" "value" "1")
                (dict "name" "LOG_CHANNEL" "value" "stderr") }}
            {{- if eq (include "php.cloud.provider" .) "AWS" }}
            {{- $defaults = append $defaults (dict "name" "AWS_REGION" "value" .Values.cloud.region) }}
            {{- end }}
            {{- include "php.application.env" (dict "defaults" $defaults "env" .Values.application.env) | nindent 12 }}
          resources:
            {{- include "php.resources" .Values.job.resources | nindent 12 }}
          {{- if .Values.newrelic.ephemeralPods.enabled }}
          volumeMounts:
            - name: newrelic-log
              mountPath: /var/log/newrelic/
          {{- end }}
      restartPolicy: {{ .Values.job.restartPolicy }}
      {{- if .Values.newrelic.ephemeralPods.enabled }}
      volumes:
        - name: newrelic-log
          emptyDir: {}
      {{- end }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- end }}
