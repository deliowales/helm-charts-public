#######################################################################
#                         VALUES FOR PHP CHART
# THESE ARE DEFAULTS AND CAN BE OVERRIDDEN IN THE SERVICE'S VALUES FILE
#######################################################################
application:
  # -- Name of the application e.g. Deals
  name: "php"
  # -- Quit php-fpm and nginx with SIGQUIT on a preStop hook rather than letting
  # the kubelet's SIGTERM stop them dead, so in-flight requests finish. Needs the
  # service's entrypoint to `exec` php-fpm: without it PID 1 is the shell, which
  # ignores SIGQUIT, and the pod waits out its grace period exactly as it does
  # today. Turn off for an image whose entrypoint has not been fixed yet.
  gracefulShutdown: true
  # -- Any args that need to be supplied to the `ENTRYPOINT` command.
  args: []
  extraVolumes: []
  readinessProbe:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 2
    timeoutSeconds: 5
    failureThreshold: 15
  livenessProbe:
    enabled: true
  healthcheck:
    livenessPath: "/_/system/liveness"
    readinessPath: "/_/system/readiness"
    headers: ""
  # -- Enable CRON. This is only to be used with `Horizon`
  cron:
    enabled: false
    phpConfig:
      maxExecutionTime: 30
  # -- Application environment variables. Currently, most of these should be stored in Vault and defined in Terragrunt.
  env: []
  # Configure container registry details
  image:
    # -- Name of the ECR/ACR repository
    repository: ""
    # -- Image tag to be pulled
    tag: "0.0.0"
    pullPolicy: IfNotPresent
  # @ignored Application container resources. Please ensure that these are fine-tuned when load-testing
  # has been carried out and a baseline has been defined.
  resources:
    limits:
      cpu:
      memory: ""
    requests:
      cpu: ""
      memory: ""

  migrations:
    enabled: false
    args: "migrations"
    backoffLimit: 2
    # -- Seconds a finished job is kept before Kubernetes deletes it, long
    # enough to read its logs after the fact.
    ttlSecondsAfterFinished: 86400
    # -- Node labels the migration pod must match. Defaults to on-demand
    # capacity: a kill mid-DDL is the one failure in the estate that needs a
    # human, and the job runs for seconds. Set `nodeSelector: null` to lift it —
    # an empty mapping will not, because Helm merges it into the default.
    nodeSelector:
      eks.amazonaws.com/capacityType: ON_DEMAND
    # -- PriorityClass for the migration pod. Empty unless the cluster defines one.
    priorityClassName: ""
    resources:
      limits:
        cpu: 1
        memory: 1G
      requests:
        cpu: 500m
        memory: 500M

authorizationPolicy:
  enabled: true

# -- IAM Role to allow the application access to AWS resources (e.g. S3, SQS, Lambda) if needed.
aws:
  iam:
    enabled: false
    role: ""
    rolePrefix: ""

azure:
  identity:
    enabled: false
    clientName: ""
    name: ""
    resourceName: ""

# Configure cloud details
cloud:
  # -- **Required**: Cloud Environment. `staging-demo` (aws only), `demo`, `staging-production` (azure only) or `production`.
  environment: "uat"
  # -- **Required**: Cloud Provider. Either `AWS` or `Azure`
  provider: "aws"
  # -- Cloud Region. Only needed for AWS
  region: "eu-west-1"
  # -- **Required**: URL for the Container Registry
  containerRegistryURL: "1234.ecr.com"

cron:
  enabled: false
  args: ""
  schedule: ""
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: "Forbid"
  vault:
    enabled: true
  restartPolicy: "OnFailure"
  backoffLimit: 1
  # -- Node labels the cron pod must match.
  nodeSelector: {}
  # -- PriorityClass for the cron pod. Empty unless the cluster defines one.
  priorityClassName: ""
  resources:
    limits:
      cpu:
      memory: ""
    requests:
      cpu:
      memory: ""

deployment:
  enabled: true
  # Horizontal Pod Autoscaler configuration.
  hpa:
    enabled: true
    # -- Maximum number of replica pods
    maxReplicas: 10
    # -- Minimum number of replica pods
    minReplicas: 3
    # -- Target CPU usage (%)
    targetCPU: 70
    # -- Target Memory usage (Mi). Default is `(request+limit) / 2`. Feel free to overwrite that here if necessary.
    targetMemory: 70
  # Specify what type of node you want this app to be deployed on: ["cpu", "memory"]
  nodeSelector:
    toleration: ""
    # -- Node labels the pod must match, merged with the toleration label above.
    # `{eks.amazonaws.com/capacityType: ON_DEMAND}` keeps a pod off spot
    # capacity on an EKS managed node group.
    labels: {}
  # -- Seconds the kubelet waits between SIGTERM and SIGKILL. A spot
  # interruption notice is 120 seconds for the whole node, not a budget per pod:
  # EKS begins evicting only after a delay and then works through the pods one
  # at a time, so on a busy node what any single pod actually gets is seconds.
  # AWS's guidance for reclaimable capacity is 30 or less, and past that a pod
  # is likelier to be killed with no SIGTERM at all than to be given longer. Omitted
  # entirely when unset, which leaves Kubernetes' own default of 30.
  # This is also the ceiling on `application.gracefulShutdown`: preStop and the
  # SIGTERM that follows it share this one budget, so a request still running at
  # the deadline is killed however graceful the hook was. A request can run for
  # up to `fpm.requestTerminateTimeout`, so a service that raises it past what
  # spot leaves room for cannot drain that request on reclaimable capacity.
  terminationGracePeriodSeconds: ""
  # Enables the nginx pod to be created with the deployment
  nginx:
    enabled: true
  # -- Replica count not considering the HPA
  replicaCount: 3
  # -- RollingUpdate parameters, e.g. `{maxSurge: 1, maxUnavailable: 0}` for
  # zero-downtime rollouts. Omitted entirely when unset, which leaves the API
  # server's 25% default — at 3 replicas that rounds to a surge of 1 and no
  # unavailability, so the pods replace one at a time.
  strategy: {}
  # -- Configure Topology Spread Constrains. A constraint carries a single
  # topologyKey, so keeping replicas off one node and out of one availability
  # zone are separate entries — list both. A bare mapping is still accepted for
  # the single-constraint case.
  ## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "ScheduleAnyway"
    - maxSkew: 1
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: "ScheduleAnyway"
  datadog:
    enabled: false

destinationRule:
  enabled: true

# Configuration options for the php-fpm `www` pool. `maxChildren` is the ceiling
# on requests this pod serves at once; anything past it queues in the listen
# backlog. Left unset, it is sized from `application.resources.limits.memory`:
#   maxChildren = (memory limit - 60Mi for the fpm master and opcache) / workerMemoryMi
# kept between 5 and 32, and 5 when no limit is set. The spare-server counts
# follow from it unless set. Remember `phpConfig.memoryLimit` is the worst case
# a single worker can reach.
fpm:
  # -- Process manager. `dynamic`, `static` or `ondemand`.
  pm: "dynamic"
  # -- (int) Maximum number of worker processes, i.e. the pod's request concurrency.
  # @default -- sized from the memory limit: 5 at 200Mi or less, 24 at 1Gi, 32 at 2Gi or more
  maxChildren:
  # -- Memory one worker is expected to add, in Mi, when sizing `maxChildren`.
  # Measured worker PSS runs ~20Mi (horizon) to ~40Mi (core, portfolio).
  workerMemoryMi: 40
  # -- (int) Workers forked on startup. Must sit between `minSpareServers` and `maxSpareServers`. `dynamic` only.
  # @default -- halfway between `minSpareServers` and `maxSpareServers`
  startServers:
  # -- (int) Idle workers kept available to absorb a burst. `dynamic` only.
  # @default -- a tenth of `maxChildren`, at least 1
  minSpareServers:
  # -- (int) Idle workers above which the pool is trimmed back. `dynamic` only.
  # @default -- three tenths of `maxChildren`, at least 3
  maxSpareServers:
  # -- Wall-clock limit on a single request, after which the worker is killed.
  # `phpConfig.maxExecutionTime` only counts CPU time, so it never stops a worker
  # blocked on a slow downstream call; this does. `0` disables it. Keep
  # `nginx.config.fastcgiTimeout` at or above it.
  requestTerminateTimeout: "60s"
  # -- How long an idle worker survives. `ondemand` only.
  processIdleTimeout: "10s"
  # -- Requests a worker serves before it is respawned. `0` is unlimited; set it to recycle workers around a memory leak.
  maxRequests: 0

istio:
  tls:
    mode: ISTIO_MUTUAL
  mtls:
    mode: STRICT
  # List of services **allowed** to make requests to the current service.
  principals: []
  # Subsets of endpoints of a service for routing traffic to specific versions of application.
  subsets: []
  portLevelSettings: []
  externalIngress:
    enabled: true
    path: "" # the path to remove e.g. /kong/branding
  virtualService:
    enabled: true
    gateways: []
    hosts: []
  # Per-deployment sidecar sizing. Unset, the pod inherits the mesh defaults set
  # in the bootstrap. Setting any one of these switches the pod to annotation
  # sizing, which replaces the mesh values outright rather than merging, so all
  # four are emitted together and the unset ones fall back to the mesh figures.
  # istio-init reads the same annotations — it cannot be sized separately.
  proxy:
    cpu: ""
    memory: ""
    cpuLimit: ""
    memoryLimit: ""

job:
  enabled: false
  name: ""
  # -- Node labels the job pod must match. Defaults to on-demand capacity: a job
  # that cannot be safely retried should not be interrupted, and it runs too
  # briefly to be worth discounting. Set `nodeSelector: null` to lift it — an
  # empty mapping will not, because Helm merges it into the default.
  nodeSelector:
    eks.amazonaws.com/capacityType: ON_DEMAND
  # -- PriorityClass for the job pod. Empty unless the cluster defines one.
  priorityClassName: ""
  annotations:
  vault:
    enabled: true
  args: ""
  restartPolicy: "OnFailure"
  backoffLimit: 2
  # -- Seconds a finished job is kept before Kubernetes deletes it, long enough
  # to read its logs after the fact.
  ttlSecondsAfterFinished: 86400
  resources:
    limits:
      cpu:
      memory: ""
    requests:
      cpu:
      memory: ""

# @ignored Configure FluentBit - PHP services only
logging:
  enabled: false
  image:
    repository: fluent-bit
    tag: php-1.9.1
    pullPolicy: Always
  # -- Path to application log. If framework is `laravel`, you must use `laravel.log` instead of `lumen.log`
  logPath: /var/www/html/storage/logs/lumen.log
  multiLine: "On"
  parserPath: /fluent-bit/etc/php-parser.conf
  resources:
    limits:
      cpu: "100m"
      memory: "100Mi"
    requests:
      cpu: "10m"
      memory: "10Mi"

newrelic:
  licenseKey: ""
  ephemeralPods:
    enabled: false

nginx:
  config:
    #    This is nginx default max body size
    clientMaxBodySize: 1M
    # -- How long nginx waits on php-fpm before answering 504. Keep it at or
    # above `fpm.requestTerminateTimeout`.
    fastcgiTimeout: "60s"
  image:
    repository: nginx
    tag: 1.30.4-alpine-unprivileged
    pullPolicy: Always
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "10m"
      memory: "10Mi"
  service:
    type: NodePort
    # -- Port that nginx is listening on
    internalPort: ""

# Pod Disruption Budget. Leave as false unless instructed otherwise.
pdb:
  enabled: false
  # -- Pods that must stay available during a voluntary disruption. Defaults to
  # 2 when neither this nor `maxUnavailable` is set. Mutually exclusive with it.
  minAvailable: ""
  # -- Pods that may be unavailable at once. Prefer this over `minAvailable` on
  # an autoscaled service: `minAvailable: 1` against three replicas permits
  # losing two, where `maxUnavailable: 1` bounds the loss whatever the replica
  # count moves to. Mutually exclusive with `minAvailable`.
  maxUnavailable: ""
  # -- Whether a pod that is running but not Ready may be evicted even when the
  # budget is not met. `AlwaysAllow` stops a crash-looping pod from blocking a
  # node drain; it is not serving traffic, so the budget has nothing to protect.
  unhealthyPodEvictionPolicy: AlwaysAllow

peerAuthentication:
  enabled: true

# Configuration options for `php.ini`. Leave blank for default values.
phpConfig:
  maxExecutionTime: 30
  memoryLimit: 128M
  uploadMaxFilesize: 2M
  postMaxSize: 8M
  sessionHandler: ""
  sessionSavePath: ""

scheduler:
  enabled: false
  # -- Node labels the scheduler pod must match.
  nodeSelector: {}
  # -- Seconds the kubelet waits between SIGTERM and SIGKILL. See the supervisor
  # note; same reasoning, same default.
  terminationGracePeriodSeconds: 30

service:
  enabled: true
  externalDNS:
    enabled: false
    host: ""
  port: 80
  type: ClusterIP

serviceAccount:
  enabled: true
  # -- Leave blank to default to the application name
  name: ""

serviceEntry:
  enabled: false
  hosts: []
  location: ""
  ports: []

supervisor:
  # -- Run a `supervisord` deployment alongside the application. The image's
  # entrypoint must handle the `supervisor` argument, otherwise the liveness
  # probe (`pgrep -a supervisord`) can never pass.
  enabled: false
  horizon:
    enabled: false
  hpa:
    enabled: false
  # -- Node labels the supervisor pod must match.
  nodeSelector: {}
  # -- Seconds the kubelet waits between SIGTERM and SIGKILL. A ceiling, not a
  # wait: the pod goes as soon as the process exits. A longer value does not buy
  # a longer wait on reclaimable capacity — the 120 second interruption notice
  # covers the whole node and EKS evicts sequentially, so a worker holding out
  # for its ceiling is one the node outlives, killed with no SIGTERM at all. 30
  # is Kubernetes' own default and what AWS asks for on spot; a job that cannot
  # finish inside it needs to be resumable rather than given a bigger number.
  # Also drives supervisord's `stopwaitsecs`, ten seconds lower, so the worker
  # gets most of this window and supervisord still has time to exit before the
  # kubelet's SIGKILL. Unset, supervisord falls back to its own 10s default,
  # which is shorter than most jobs.
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu:
      memory: 500Mi
    requests:
      cpu: 250m
      memory: 250Mi

# -- Vault configuration
vault:
  # -- Environment of the vault. Format: `<< env >>/<< vault name >>
  env: ""
  # -- Role name
  role: ""
  # -- Optional path to a platform-wide shared secret (e.g. `<< env >>/data/_shared`).
  # When set, its keys are appended into the same injected `/vault/secrets/env`
  # file after the service's own secret, giving true single-source shared config.
  sharedEnv: ""

nightwatch:
  enabled: false
  image:
    repository: docker.io/laravelphp/nightwatch-agent
    tag: v1
    pullPolicy: Always
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  env: []
