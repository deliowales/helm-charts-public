apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "python.application.name" . }}"
  labels:
    {{- include "python.labels" . | nindent 4 }}
  annotations:
    {{- include "python.annotations" . | nindent 4 }}


spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include "python.application.name" . }}"
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- include "python.annotations" . | nindent 8 }}
        {{- include "python.application.vault.annotations" . | nindent 8 }}
        {{- include "python.istio.proxy.annotations" . | nindent 8 }}
      labels:
        {{- include "python.labels" . | nindent 8 }}
        {{- if and (eq (include "python.cloud.provider" .) "Azure") (eq .Values.azure.identity.enabled true) }}
        aadpodidbinding: {{ .Values.azure.identity.name }}
        {{- end }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "python.deployment.topologySpreadConstraints" . | nindent 6 }}
      {{- if or .Values.deployment.nodeSelector.toleration .Values.deployment.nodeSelector.labels }}
      nodeSelector:
        {{- if .Values.deployment.nodeSelector.toleration }}
        {{- include "node.deployment.nodeSelector.toleration" . | nindent 8 }}
        {{- end }}
        {{- with .Values.deployment.nodeSelector.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.deployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "python.application.name" . }}
      containers:
        - name: "{{ include "python.application.name" . }}"
          image: "{{ include "python.application.imageURL" . }}"
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          securityContext: {{ include "python.application.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- $defaults := list
                (dict "name" "PLATFORM" "value" (include "python.cloud.provider" .))
                (dict "name" "APP_NAME" "value" (.Values.application.name | lower))
                (dict "name" "SENTRY_ENABLED" "value" "true")
                (dict "name" "SENTRY_TRACES_SAMPLE_RATE" "value" (ternary "0.5" "1" (any (eq .Values.cloud.environment "demo") (eq .Values.cloud.environment "production"))))
                (dict "name" "SENTRY_PROFILES_SAMPLE_RATE" "value" "1")
                (dict "name" "LOG_CHANNEL" "value" "stderr") }}
            {{- if eq (include "python.cloud.provider" .) "AWS" }}
            {{- $defaults = append $defaults (dict "name" "AWS_REGION" "value" .Values.cloud.region) }}
            {{- end }}
            {{- include "python.application.env" (dict "defaults" $defaults "env" .Values.application.env) | nindent 12 }}
          resources:
            {{- include "python.resources" .Values.application.resources | nindent 12 }}
          {{- if .Values.application.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              port: 8000
              path: {{ .Values.application.healthcheck.livenessPath }}
              {{- if (include "python.application.healthcheck.headers" . ) -}}
              {{ include "python.application.healthcheck.headers" .  | nindent 14 }}
              {{- end }}
            initialDelaySeconds: 10
            timeoutSeconds: 5
          {{ end }}
          {{- if .Values.application.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              port: 8000
              path: {{ .Values.application.healthcheck.readinessPath }}
              {{- if (include "python.application.healthcheck.headers" . ) -}}
              {{ include "python.application.healthcheck.headers" .  | nindent 14 }}
              {{- end }}
            initialDelaySeconds: 5
            timeoutSeconds: 1
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.application.extraVolumes -}}
            {{- include "python.application.extraConfigmapMounts" . | nindent 12 }}
            {{- end }}

      securityContext:
        fsGroup: 1000

      volumes:
        - name: tmp
          emptyDir: { }
        {{- if .Values.application.extraVolumes }}
        {{- include "python.application.extraConfigmapVolumes" . | nindent 8 }}
        {{- end }}