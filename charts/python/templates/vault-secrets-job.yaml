{{- if .Values.vaultSecrets.enabled }}
{{- $vs := .Values.vaultSecrets }}
{{- $kv := $vs.kvMount | default (splitList "/" .Values.vault.env | first) }}
{{- $runnerSecret := printf "%s/%s" $kv $vs.runnerSecret }}
{{- $repo := $vs.repository | default (include "python.application.name" .) }}
{{- $ref := $vs.ref | default .Values.application.image.tag }}
{{- $leaf := $vs.leaf | default (printf "infra/terraform/environments/prod/%s/vault-secrets" .Values.cloud.region) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "python.application.name" . }}-vault-secrets"
  labels:
    {{- include "python.labels" . | nindent 4 }}
  annotations:
    {{- include "python.annotations" . | nindent 4 }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $vs.backoffLimit }}
  activeDeadlineSeconds: {{ $vs.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "python.application.name" . }}-vault-secrets
        chart: {{ include "python.chartref" . }}
        release: {{ .Release.Name }}
      annotations:
        {{- include "python.annotations" . | nindent 8 }}
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/role: {{ $vs.vaultRole | quote }}
        vault.hashicorp.com/agent-inject-secret-github-token: {{ $runnerSecret | quote }}
        vault.hashicorp.com/agent-inject-template-github-token: |
          {{ `{{- with secret "` }}{{ $runnerSecret }}{{ `" -}}{{ .Data.data.GITHUB_TOKEN }}{{- end -}}` }}
        vault.hashicorp.com/agent-inject-secret-vault-ca: {{ $runnerSecret | quote }}
        vault.hashicorp.com/agent-inject-template-vault-ca: |
          {{ `{{- with secret "` }}{{ $runnerSecret }}{{ `" -}}{{ .Data.data.VAULT_CA_PEM }}{{- end -}}` }}
    spec:
      serviceAccountName: {{ $vs.serviceAccount.name }}
      restartPolicy: Never
      {{- with $vs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: vault-secrets
          image: {{ $vs.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: {{ include "python.application.name" . | quote }}
            - name: REPO
              value: {{ $repo | quote }}
            - name: REF
              value: {{ $ref | quote }}
            - name: LEAF
              value: {{ $leaf | quote }}
            - name: VAULT_ADDR
              value: {{ $vs.vaultAddr | required "vaultSecrets.vaultAddr is required when vaultSecrets.enabled is true" | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $vs.resources | nindent 12 }}
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
