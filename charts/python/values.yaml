#######################################################################
#                         VALUES FOR PYTHON CHART
# THESE ARE DEFAULTS AND CAN BE OVERRIDDEN IN THE SERVICE'S VALUES FILE
#######################################################################
application:
  name: "python"
  args: []
  extraVolumes: []
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  healthcheck:
    livenessPath: "/health"
    readinessPath: "/health"
    headers: ""
  cron:
    enabled: false
  env: []
  image:
    repository: ""
    tag: "0.0.0"
    pullPolicy: Always
  resources:
    limits:
      cpu:
      memory: ""
    requests:
      cpu: ""
      memory: ""

  migrations:
    enabled: false
    args: "migrations"
    restartPolicy: OnFailure
    backoffLimit: 2
    resources:
      limits:
        cpu: 1
        memory: 1G
      requests:
        cpu: 500m
        memory: 500M

authorizationPolicy:
  enabled: true

aws:
  iam:
    enabled: false
    role: ""
    rolePrefix: ""

azure:
  identity:
    enabled: false
    clientName: ""
    name: ""
    resourceName: ""

cloud:
  # -- **Required**: Cloud Environment. `staging-demo` (aws only), `demo`, `staging-production` (azure only) or `production`.
  environment: "uat"
  # -- **Required**: Cloud Provider. Either `AWS` or `Azure`
  provider: "aws"
  # -- Cloud Region. Only needed for AWS
  region: "eu-west-1"
  # -- **Required**: URL for the Container Registry
  containerRegistryURL: "1234.ecr.com"

peerAuthentication:
  enabled: true

cron:
  enabled: false
  args: ""
  schedule: ""
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: "Forbid"
  vault:
    enabled: true
  restartPolicy: "OnFailure"
  backoffLimit: 1
  resources:
    limits:
      cpu:
      memory: ""
    requests:
      cpu:
      memory: ""

deployment:
  enabled: true
  hpa:
    enabled: true
    maxReplicas: 10
    minReplicas: 3
    targetCPU: 70
    targetMemory: 70
  nodeSelector:
    toleration: ""
    # -- Node labels the pod must match, merged with the toleration label above.
    # `{eks.amazonaws.com/capacityType: ON_DEMAND}` keeps a pod off spot
    # capacity on an EKS managed node group.
    labels: {}
  # -- Seconds the kubelet waits between SIGTERM and SIGKILL. A spot
  # interruption notice is 120 seconds, so a workload that must finish its
  # current unit of work needs a value comfortably inside that. Omitted
  # entirely when unset, which leaves Kubernetes' own default of 30.
  terminationGracePeriodSeconds: ""
  # -- Replica count not considering the HPA
  replicaCount: 3
  # -- Configure Topology Spread Constrains.
  ## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "ScheduleAnyway"
  datadog:
    enabled: false

destinationRule:
  enabled: true

istio:
  tls:
    mode: ISTIO_MUTUAL
  mtls:
    mode: STRICT
  principals: []
  subsets: []
  portLevelSettings: []
  externalIngress:
    enabled: true
    path: ""
  virtualService:
    enabled: true
    gateways: []
    hosts: []
  # Per-deployment sidecar sizing. Unset, the pod inherits the mesh defaults set
  # in the bootstrap. Setting any one of these switches the pod to annotation
  # sizing, which replaces the mesh values outright rather than merging, so all
  # four are emitted together and the unset ones fall back to the mesh figures.
  # istio-init reads the same annotations — it cannot be sized separately.
  proxy:
    cpu: ""
    memory: ""
    cpuLimit: ""
    memoryLimit: ""

job:
  enabled: false
  name: ""
  annotations:
  vault:
    enabled: true
  args: ""
  restartPolicy: "OnFailure"
  backoffLimit: 2
  resources:
    limits:
      cpu:
      memory: ""
    requests:
      cpu:
      memory: ""

newrelic:
  licenseKey: ""
  ephemeralPods:
    enabled: false

# Pod Disruption Budget. Leave as false unless instructed otherwise.
pdb:
  enabled: false
  # -- Pods that must stay available during a voluntary disruption. Defaults to
  # 2 when neither this nor `maxUnavailable` is set. Mutually exclusive with it.
  minAvailable: ""
  # -- Pods that may be unavailable at once. Prefer this over `minAvailable` on
  # an autoscaled service: `minAvailable: 1` against three replicas permits
  # losing two, where `maxUnavailable: 1` bounds the loss whatever the replica
  # count moves to. Mutually exclusive with `minAvailable`.
  maxUnavailable: ""

scheduler:
  enabled: false

service:
  enabled: true
  externalDNS:
    enabled: false
    host: ""
  port: 8000
  type: ClusterIP

serviceAccount:
  enabled: true
  name: ""

serviceEntry:
  enabled: false
  hosts: []
  location: ""
  ports: []
  ping:
    hosts: []

# -- Vault configuration
vault:
  # -- Environment of the vault. Format: `<< env >>/<< vault name >>
  env: ""
  # -- Role name
  role: ""
  # -- Optional path to a platform-wide shared secret (e.g. `<< env >>/data/_shared`).
  # When set, its keys are appended into the same injected `/vault/secrets/env`
  # file after the service's own secret, giving true single-source shared config.
  sharedEnv: ""
