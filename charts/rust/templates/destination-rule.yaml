{{- if eq .Values.destinationRule.enabled true }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "rust.application.name" . }}
  labels:
    {{- include "rust.labels" . | nindent 4 }}
  annotations:
    {{- include "rust.annotations" . | nindent 4 }}
spec:
  host: {{ include "rust.application.name" . }}
  trafficPolicy:
    tls:
      mode: {{ .Values.istio.tls.mode }}
  {{ if .Values.istio.subsets -}}
  subsets:
    {{- range .Values.istio.subsets }}
    - name: {{ .name }}
      labels:
      {{- range .labels }}
        {{ .name }}: {{ .value }}
      {{- end }}
    {{- end }}
  {{- end -}}
{{- end -}}
