{{ if eq .Values.job.enabled true }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.job.name }}
  annotations:
    {{- toYaml .Values.job.annotations | nindent 4 }}
spec:
  template:
    metadata:
      annotations:
        {{- include "rust.istio.proxy.annotations" . | nindent 8 }}
        {{- if not (hasKey (.Values.job.podAnnotations | default dict) "proxy.istio.io/config") }}
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        {{- end }}
        {{- with .Values.job.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.job.vault.enabled true }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.env }}
        vault.hashicorp.com/agent-inject-template-env: |
            {{- if .Values.vault.sharedEnv }}
            {{`{{ with secret "` }}{{ .Values.vault.sharedEnv }}{{`"  -}}
            {{ range $k, $v := .Data.data -}}
            export {{ $k }}='{{ $v }}'
            {{ end -}}
            {{ end -}}`}}
            {{- end }}
            {{`{{ with secret "` }}{{ .Values.vault.env }}{{`"  -}}
            {{ range $k, $v := .Data.data -}}
            export {{ $k }}='{{ $v }}'
            {{ end -}}
            {{ end -}}`}}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      {{- with .Values.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rust.application.name" . }}
      containers:
        - name: {{ include "rust.application.name" . }}
          image: {{ include "rust.application.imageURL" . }}
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          {{- with .Values.job.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "rust.application.env" . | nindent 12 }}
          securityContext:
            runAsUser: {{ .Values.application.securityContext.runAsUser }}
            runAsGroup: {{ .Values.application.securityContext.runAsGroup }}
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            {{- include "rust.resources" .Values.job.resources | nindent 12 }}
      {{- /* Never, not OnFailure: the entrypoint stops the Istio sidecar on the way
      out, and a sidecar that exits 0 is not restarted, so an in-place retry would
      run with no proxy. Never gives every attempt a fresh pod and sidecar. */}}
      restartPolicy: Never
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
