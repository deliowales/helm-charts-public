{{- if eq .Values.pdb.enabled true }}
{{- if and .Values.pdb.minAvailable .Values.pdb.maxUnavailable }}
{{- fail "pdb.minAvailable and pdb.maxUnavailable cannot both be set" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rust.application.name" . }}
  labels:
    {{- include "rust.labels" . | nindent 4 }}
  annotations:
    {{- include "rust.annotations" . | nindent 4 }}
spec:
  {{- if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.pdb.minAvailable | default 2 }}
  {{- end }}
  unhealthyPodEvictionPolicy: {{ .Values.pdb.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rust.application.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
