{{- if and (eq .Values.virtualService.enabled true) (ne .Values.application.name "horizon") }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "rust.application.name" . }}
  labels:
    {{- include "rust.labels" . | nindent 4 }}
  annotations:
    {{- include "rust.annotations" . | nindent 4 }}
spec:
  hosts:
    - {{ include "rust.application.name" . }}
    {{- if .Values.virtualService.hosts }}
    {{- range .Values.virtualService.hosts }}
    {{ printf "- %s" .}}
    {{- end }}
    {{- end }}
  {{- if .Values.virtualService.gateways }}
  gateways:
  {{- range .Values.virtualService.gateways }}
    {{ printf "- %s" .}}
  {{- end }}
  {{- end }}
  http:
    - route:
        - destination:
            host: {{ include "rust.application.name" . }}
      {{- with .Values.virtualService.timeout }}
      timeout: {{ . }}
      {{- end }}
      {{- with .Values.virtualService.retries }}
      retries:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
